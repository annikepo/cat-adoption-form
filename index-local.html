<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cat Adoption Form</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Fredoka:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

    <main class="screen">
        <form class="form" action="#" method="post">

            <h1 class="main-title">Cat Adoption Form</h1>

            <p class="main-info">
                Would you like to adopt a cat?
                Please fill out the form below!
            </p>

            <div class="form-group">
                <label class="label" for="full-name">Full name</label>
                <input
                    class="input-field"
                    type="text"
                    id="full-name"
                    name="full-name"
                    placeholder="Enter your name"
                    minlength="2"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label class="label" for="email">Email address</label>
                <input
                    class="input-field"
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <fieldset class="form-group">
                <legend class="label">
                    What type of cat would you like to adopt?
                </legend>

                <ul class="form-list">
                    <li>
                        <input
                            type="radio"
                            id="cat-tabby"
                            name="cat-type"
                            value="tabby"
                            required
                        >
                        <label class="choice-label" for="cat-tabby">
                            Tabby cat
                        </label>
                    </li>

                    <li>
                        <input
                            type="radio"
                            id="cat-orange"
                            name="cat-type"
                            value="orange"
                        >
                        <label class="choice-label" for="cat-orange">
                            Orange cat
                        </label>
                    </li>

                    <li>
                        <input
                            type="radio"
                            id="cat-black"
                            name="cat-type"
                            value="black"
                        >
                        <label class="choice-label" for="cat-black">
                            Black cat
                        </label>
                    </li>

                    <li>
                        <input
                            type="radio"
                            id="cat-white"
                            name="cat-type"
                            value="white"
                        >
                        <label class="choice-label" for="cat-white">
                            White cat
                        </label>
                    </li>

                    <li>
                        <input
                            type="radio"
                            id="cat-any"
                            name="cat-type"
                            value="any"
                        >
                        <label class="choice-label" for="cat-any">
                            Any type of cat
                        </label>
                    </li>
                </ul>
            </fieldset>

            <div class="form-group">
                <label class="label" for="password">
                    Create a password
                </label>
                <input
                    class="input-field"
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="form-group">
                <label class="label" for="message">Your message</label>
                <textarea
                    class="textarea"
                    id="message"
                    name="message"
                    placeholder="Tell us why you would like to adopt a cat"
                    minlength="20"
                    maxlength="500"
                    required
                ></textarea>
            </div>

            <fieldset class="form-group">
                <legend class="label">What kind of home do you have?</legend>

                <ul class="form-list">
                    <li>
                        <input
                            type="radio"
                            id="home-apartment"
                            name="home-type"
                            value="apartment"
                            required
                        >
                        <label class="choice-label" for="home-apartment">
                            Apartment
                        </label>
                    </li>

                    <li>
                        <input
                            type="radio"
                            id="home-house"
                            name="home-type"
                            value="house"
                        >
                        <label class="choice-label" for="home-house">
                            House
                        </label>
                    </li>

                    <li>
                        <input
                            type="radio"
                            id="home-other"
                            name="home-type"
                            value="other"
                        >
                        <label class="choice-label" for="home-other">
                            Other
                        </label>
                    </li>
                </ul>
            </fieldset>

            <fieldset class="form-group">
                <legend class="label">
                    What information would you like to receive?
                </legend>

                <ul class="form-list">
                    <li>
                        <input
                            type="checkbox"
                            id="available-cats"
                            name="information"
                            value="available-cats"
                        >
                        <label class="choice-label" for="available-cats">
                            Information about available cats
                        </label>
                    </li>

                    <li>
                        <input
                            type="checkbox"
                            id="adoption-advice"
                            name="information"
                            value="adoption-advice"
                        >
                        <label class="choice-label" for="adoption-advice">
                            Adoption advice
                        </label>
                    </li>

                    <li>
                        <input
                            type="checkbox"
                            id="adoption-events"
                            name="information"
                            value="events"
                        >
                        <label class="choice-label" for="adoption-events">
                            Information about adoption events
                        </label>
                    </li>
                </ul>
            </fieldset>

            <div class="checkbox-container">
                <input
                    type="checkbox"
                    id="cat-information"
                    name="cat-information"
                >
                <label class="checkbox-label" for="cat-information">
                    I would like to receive information about cats by email.
                </label>
            </div>

            <div class="checkbox-container">
                <input
                    type="checkbox"
                    id="terms"
                    name="terms"
                    required
                >
                <label class="checkbox-label" for="terms">
                    I agree to the adoption form terms.
                </label>
            </div>

            <button class="button" type="submit">
                Submit application
            </button>

        </form>
    </main>

</body>
</html>
